name: Temporary public-candidate E2E

on:
  push:
    branches: [public-candidate]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare E2E environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'KryptonPlay'
          Set-Location $root
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue 'data'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue 'test-library'
          New-Item -ItemType Directory -Force -Path 'test-library\Filmes' | Out-Null
          $ffmpeg = (Get-Command ffmpeg -ErrorAction Stop).Source
          $ffprobe = (Get-Command ffprobe -ErrorAction Stop).Source
          $media = Join-Path $root 'test-library\Filmes\Filme Teste.mp4'
          & $ffmpeg -hide_banner -loglevel error -f lavfi -i 'color=c=black:s=320x240:r=1' -t 30 -an -c:v libx264 -pix_fmt yuv420p -movflags +faststart $media
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao gerar a mídia de E2E.' }
          & $ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 $media
          if ($LASTEXITCODE -ne 0) { throw 'Mídia de E2E inválida.' }
          $password = [Convert]::ToBase64String((1..24 | ForEach-Object { Get-Random -Minimum 0 -Maximum 256 } | ForEach-Object { [byte]$_ })).Substring(0,24) + 'Aa1!'
          "KRYPTONPLAY_TEST_LIBRARY=$root\test-library" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "KRYPTONPLAY_ADMIN_PASSWORD=$password" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "KRYPTONPLAY_TEST_PORT=18001" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "KRYPTONPLAY_BASE_URL=http://127.0.0.1:18001" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install test dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.12 -m pip install -q -r KryptonPlay\requirements.txt
          py -3.12 -m pip install -q playwright
          py -3.12 -m playwright install chromium

      - name: Start server and run real Web E2E
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'KryptonPlay'
          $server = $null
          try {
            $server = Start-Process py -ArgumentList '-3.12 tests\run_e2e_server.py' -WorkingDirectory $root -PassThru -WindowStyle Hidden -RedirectStandardOutput 'server.log' -RedirectStandardError 'server-error.log'
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              if ($server.HasExited) { throw "Servidor encerrou durante a inicialização: $($server.ExitCode)" }
              try { $health = Invoke-RestMethod "$env:KRYPTONPLAY_BASE_URL/health" -TimeoutSec 2; if ($health.status -eq 'ok') { $ready = $true; break } } catch { Start-Sleep 1 }
            }
            if (-not $ready) { throw 'Servidor E2E não ficou pronto.' }
            $setup = @{ username = 'admin'; password = $env:KRYPTONPLAY_ADMIN_PASSWORD; language = 'pt-BR'; region = 'BR'; timezone = 'America/Sao_Paulo'; server_name = 'KryptonPlay E2E'; network_access = 'local'; indexing_mode = 'later'; playback_mode = 'automatic'; libraries = @(@{ name = 'Filmes'; library_type = 'movie'; locations = @($env:KRYPTONPLAY_TEST_LIBRARY) }) } | ConvertTo-Json -Depth 8 -Compress
            $created = Invoke-RestMethod -Method Post -Uri "$env:KRYPTONPLAY_BASE_URL/api/setup" -ContentType 'application/json' -Body $setup
            if ($created.status -ne 'ok') { throw 'Setup E2E falhou.' }
            $login = @{ username = 'admin'; password = $env:KRYPTONPLAY_ADMIN_PASSWORD } | ConvertTo-Json -Compress
            $auth = Invoke-RestMethod -Method Post -Uri "$env:KRYPTONPLAY_BASE_URL/api/auth/login" -ContentType 'application/json' -Body $login
            if ([string]::IsNullOrWhiteSpace($auth.access_token)) { throw 'Login E2E falhou.' }
            $headers = @{ Authorization = "Bearer $($auth.access_token)" }
            $scan = Invoke-RestMethod -Method Post -Uri "$env:KRYPTONPLAY_BASE_URL/api/v1/library/scan" -Headers $headers
            if ($scan.status -ne 'ok' -or $scan.items_scanned -ne 1) { throw "Scanner E2E inesperado: $($scan | ConvertTo-Json -Compress)" }
            & py -3.12 tests\e2e_web_test.py
            if ($LASTEXITCODE -ne 0) { throw 'E2E Web falhou.' }
            Write-Host 'PUBLIC_CANDIDATE_E2E_OK'
          } catch {
            Write-Host '--- server.log ---'
            Get-Content (Join-Path $root 'server.log') -ErrorAction SilentlyContinue
            Write-Host '--- server-error.log ---'
            Get-Content (Join-Path $root 'server-error.log') -ErrorAction SilentlyContinue
            throw
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
          }
