<body>
<header><main><h1>KryptonPlay</h1><p id="app-subtitle">Biblioteca de mídia</p></main></header>
<section id="user-selection" class="panel" hidden><h2 id="who-title">Quem está assistindo?</h2><p id="user-selection-help">Selecione o usuário para iniciar a sessão neste cliente.</p><div id="user-grid" class="user-grid"></div><div id="user-selection-error" class="error"></div></section>

<main id="app" hidden>

<div id="filters" class="filters"><input id="search" type="search" placeholder="Buscar por título..."><select id="type"><option value="">Todos os tipos</option><option value="movie">Filmes</option><option value="series">Séries</option></select><button id="clear">Limpar</button></div>
<h2 class="section-title" id="library-title">Biblioteca <span id="count" class="library-count"></span></h2>
<div id="player-area" hidden><div class="player-toolbar"><button id="back-library">← Voltar à biblioteca</button><span id="now-playing"></span></div><video id="player" preload="metadata"></video><div class="player-controls"><button id="play-pause">Reproduzir</button><button id="rewind">−10s</button><button id="forward">+10s</button><button id="mute">Mudo</button><select id="speed" aria-label="Velocidade"><option value="0.5">0,5×</option><option value="0.75">0,75×</option><option value="1" selected>1×</option><option value="1.25">1,25×</option><option value="1.5">1,5×</option><option value="2">2×</option></select><input id="seek" class="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Posição"><button id="fullscreen">Tela cheia</button></div><div id="player-status" class="player-status">Pronto.</div></div>
<section id="library"><div class="card empty">A biblioteca será exibida aqui.</div></section>
</main>
<div id="modal" class="modal" hidden><article class="modal-card"><button id="close" class="close">Fechar</button><div id="detail"></div></article></div>
<script>

function t(key){return(translations[preferences.language]||translations['pt-BR'])[key]||translations['pt-BR'][key]||key}function applyTheme(theme){let value=theme==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):theme;document.body.dataset.theme=value}function applyLanguage(){let l=preferences.language||'pt-BR';document.documentElement.lang=l;$('app-subtitle').textContent=t('subtitle');$('who-title').textContent=t('who');$('user-selection-help').textContent=t('selectUser');$('login-title').textContent=t('login');$('password-label').textContent=t('password');$('login-button').textContent=t('login');$('change-user').textContent=t('changeUser');$('scan').textContent=t('scan');$('status').textContent=t('ready');$('settings').textContent=t('settings');$('logout').textContent=t('logout');$('search').placeholder=t('search');$('type').options[0].textContent=t('all');$('type').options[1].textContent=t('movies');$('type').options[2].textContent=t('series');$('clear').textContent=t('clear');$('library-title').childNodes[0].textContent=t('library')+' ';$('back-library').textContent=t('back');$('play-pause').textContent=$('player').paused?t('play'):t('pause');$('mute').textContent=$('player').muted?t('sound'):t('mute');$('fullscreen').textContent=t('fullscreen');$('close').textContent=t('close')}
async function loadPreferences(){let r=await api('/api/v1/profile/preferences');if(!r.ok)return;let p=(await r.json()).preferences||{};preferences={theme:p.theme||'system',language:p.language||'pt-BR',resume:p.resume!=='false',autoplay:p.autoplay==='true',speed:p.speed||'1'};applyTheme(preferences.theme);applyLanguage()}function headers(json=false){let h={};if(token)h.Authorization='Bearer '+token;if(json)h['Content-Type']='application/json';return h}async function api(url,opt={}){opt.headers={...headers(!!opt.body),...(opt.headers||{})};let r=await fetch(url,opt);if(r.status===401){token=null;sessionStorage.removeItem('kryptonplay_token');showUserSelection('Sessão expirada. Selecione o usuário novamente.')}return r}
function showUserSelection(e=''){stopPlayer();$('login').hidden=true;$('app').hidden=true;$('user-selection').hidden=false;$('user-selection-error').textContent=e;$('password').value='';loadUsers()}function showLoginForUser(username){selectedUsername=username;sessionStorage.setItem('kryptonplay_selected_user',username);$('user-selection').hidden=true;$('login').hidden=false;$('app').hidden=true;$('selected-user-label').textContent='Usuário selecionado: '+username;$('login-error').textContent='';$('password').value='';$('password').focus()}async function showApp(){await loadPreferences();$('user-selection').hidden=true;$('login').hidden=true;$('app').hidden=false;load()}function esc(v){return String(v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function size(n){if(n==null)return'Tamanho desconhecido';let u=['B','KB','MB','GB','TB'],i=0,x=n;while(x>=1024&&i<4){x/=1024;i++}return`${x.toFixed(i?1:0)} ${u[i]}`}function date(v){if(!v)return'Data desconhecida';return new Date(v*1000).toLocaleString(preferences.language||'pt-BR')}function time(s){s=Math.max(0,Math.floor(Number.isFinite(s)?s:0));return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
async function loadUsers(){let r=await fetch('/api/auth/users');if(!r.ok){$('user-selection-error').textContent='Não foi possível carregar os usuários.';return}let d=await r.json();if(!d.users?.length){$('user-selection-error').textContent='Nenhum usuário disponível.';return}$('user-grid').innerHTML=d.users.map(u=>`<button class="user-card" data-username="${esc(u.username)}"><div class="user-avatar">${esc((u.username||'?').charAt(0).toUpperCase())}</div><div class="user-name">${esc(u.username)}</div><div class="user-role">${u.role==='admin'?'Administrador':'Usuário'}</div></button>`).join('');document.querySelectorAll('.user-card').forEach(b=>b.onclick=()=>showLoginForUser(b.dataset.username))}async function login(){let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:selectedUsername,password:$('password').value})});if(!r.ok){let d=await r.json().catch(()=>({}));throw Error(d.detail||'Falha no login')}let d=await r.json();token=d.access_token;sessionStorage.setItem('kryptonplay_token',token);sessionStorage.setItem('kryptonplay_selected_user',selectedUsername)}$('login-form').onsubmit=async e=>{e.preventDefault();$('login-error').textContent='';try{await login();$('login-form').reset();await showApp()}catch(x){$('login-error').textContent=x.message}};$('change-user').onclick=()=>showUserSelection();$('logout').onclick=async()=>{if(token)await api('/api/auth/logout',{method:'POST'});token=null;sessionStorage.removeItem('kryptonplay_token');showUserSelection()};$('settings').onclick=()=>{location.href='/static/settings.html'};
async function progress(id){let r=await api(`/api/v1/media/${id}/progress`);return r.ok?r.json():{position_seconds:0,duration_seconds:0,completed:false}}async function stats(id){let r=await api(`/api/v1/media/${id}/stats`);return r.ok?r.json():{play_count:0,watched_seconds:0}}
async function render(items){itemsCache=items;$('count').textContent=`(${items.length})`;if(!items.length){$('library').innerHTML='<div class="card empty">Nenhuma mídia encontrada.</div>';return}$('library').innerHTML=items.map(i=>`<article class="card"><div class="poster" aria-label="Capa não disponível">${i.media_type==='movie'?'▶':'▦'}</div><div class="card-body"><h2>${esc(i.title)}</h2><div class="type">${i.media_type==='movie'?'Filme':'Série'}</div><div class="meta">${size(i.file_size)} · ${date(i.modified_at)}</div><div class="progress"><span id="p${i.id}"></span></div><div class="progress-label" id="pl${i.id}">Progresso: carregando...</div><button class="details" data-id="${i.id}">Ver detalhes</button><button class="play" data-id="${i.id}" data-title="${esc(i.title)}">${t('play')}</button><div class="stats" id="s${i.id}">Carregando estatísticas...</div></div></article>`).join('');document.querySelectorAll('.play').forEach(b=>b.onclick=()=>play(b.dataset.id,b.dataset.title));document.querySelectorAll('.details').forEach(b=>b.onclick=()=>showDetails(+b.dataset.id));for(const i of items){let[p,s]=await Promise.all([progress(i.id),stats(i.id)]),pct=p.duration_seconds>0?Math.min(100,p.position_seconds/p.duration_seconds*100):0,e=$('p'+i.id),l=$('pl'+i.id);if(e)e.style.width=pct+'%';if(l)l.textContent=p.completed?'Concluído':p.duration_seconds>0?`Progresso: ${Math.round(pct)}%`:'Progresso: não iniciado';let se=$('s'+i.id);if(se)se.textContent=`${s.play_count} reprodução(ões) · ${time(s.watched_seconds)} assistidos`}}
async function showDetails(id){let i=itemsCache.find(x=>x.id===id);if(!i)return;let[p,s]=await Promise.all([progress(id),stats(id)]),pct=p.duration_seconds>0?Math.min(100,p.position_seconds/p.duration_seconds*100):0;$('detail').innerHTML=`<div class="detail-grid"><div class="detail-poster">${i.media_type==='movie'?'▶':'▦'}</div><div class="detail-meta"><h2>${esc(i.title)}</h2><p><strong>Tipo:</strong> ${i.media_type==='movie'?'Filme':'Série'}</p><p><strong>Tamanho:</strong> ${size(i.file_size)}</p><p><strong>Modificado:</strong> ${date(i.modified_at)}</p><p><strong>Progresso:</strong> ${p.completed?'Concluído':p.duration_seconds>0?Math.round(pct)+'%':'Não iniciado'}</p><p><strong>Reproduções:</strong> ${s.play_count}</p><p><strong>Tempo assistido:</strong> ${time(s.watched_seconds)}</p></div></div><div class="detail-actions"><button id="detail-play" data-id="${id}" data-title="${esc(i.title)}">${t('play')}</button></div>`;$('detail-play').onclick=e=>{closeDetails();play(e.currentTarget.dataset.id,e.currentTarget.dataset.title)};$('modal').hidden=false}function closeDetails(){$('modal').hidden=true}function currentPosition(){return playback.fallback?playback.offset+$('player').currentTime:$('player').currentTime}async function saveCurrentProgress(completed=false){if(!current)return;let v=$('player'),duration=playback.fallback&&playback.duration?playback.duration:(Number.isFinite(v.duration)?v.duration:null),position=Math.max(0,currentPosition());if(duration&&position>duration)position=duration;await api(`/api/v1/media/${current}/progress`,{method:'PUT',body:JSON.stringify({position_seconds:position,duration_seconds:duration,completed})})}async function recordWatched(delta,started=false){if(!current||(!started&&delta<=0))return;await api(`/api/v1/media/${current}/stats`,{method:'POST',body:JSON.stringify({watched_seconds:Math.max(0,delta),started})})}

async function play(id,title){if(current)await saveCurrentProgress(false);current=+id;let p=await progress(current),info=await api(`/api/v1/media/${current}/playback-info`),capability=info.ok?await info.json():{fallback_required:false,duration_seconds:p.duration_seconds||null};playback={fallback:!!capability.fallback_required,offset:0,duration:capability.duration_seconds||p.duration_seconds||null};$('library').hidden=true;$('filters').hidden=true;$('player-area').hidden=false;$('now-playing').textContent='Reproduzindo: '+title;$('player-status').textContent='Carregando mídia...';let resume=preferences.resume&&!p.completed&&p.position_seconds>0?p.position_seconds:0;if(playback.fallback){playback.offset=resume;$('player').controls=false;$('seek').max=playback.duration||0;$('seek').value=resume;$('player').src=`/api/v1/media/${current}/stream${resume>0?`?start=${encodeURIComponent(resume.toFixed(3))}`:''}`}else{$('player').controls=true;$('seek').max=playback.duration||0;$('seek').value=resume;$('player').src=`/api/v1/media/${current}/stream`}$('player').onloadedmetadata=async()=>{let v=$('player');if(playback.fallback)setCurrentTimeSilently(0);else if(resume>0&&resume<v.duration)setCurrentTimeSilently(resume);$('seek').max=playback.duration||v.duration||0;$('seek').value=playback.fallback?resume:(resume||v.currentTime);$('player-status').textContent=`${time(currentPosition())} / ${time(playback.duration||v.duration)}`;v.playbackRate=Number(preferences.speed)||1;if(preferences.autoplay){try{await v.play();$('play-pause').textContent=t('pause')}catch(_){$('play-pause').textContent=t('play')}}else{$('play-pause').textContent=t('play')}};lastStatsTime=Date.now();await recordWatched(0,true);if(progressTimer)clearInterval(progressTimer);progressTimer=setInterval(()=>saveCurrentProgress(false),10000)}
$('player').ontimeupdate=()=>{let pos=currentPosition(),dur=playback.duration||$('player').duration;$('seek').value=pos;$('player-status').textContent=`${time(pos)} / ${time(dur)}`};$('player').onseeking=()=>{if(!playback.fallback||nativeSeekInProgress||!current)return;let v=$('player'),relative=Number(v.currentTime);if(!Number.isFinite(relative))return;let target=Math.max(0,Math.min(playback.duration??Infinity,playback.offset+relative));nativeSeekInProgress=true;seekTo(target).finally(()=>{nativeSeekInProgress=false})};$('player').onplay=()=>{$('play-pause').textContent=t('pause');lastStatsTime=Date.now()};$('player').onpause=async()=>{ $('play-pause').textContent=t('play');if(current){let delta=Math.max(0,(Date.now()-lastStatsTime)/1000);if(delta<300&&delta>0)await recordWatched(delta);await saveCurrentProgress(false)}};$('player').onended=async()=>{if(current){let delta=Math.max(0,(Date.now()-lastStatsTime)/1000);if(delta<300)await recordWatched(delta);await saveCurrentProgress(true)}};$('play-pause').onclick=()=>{$('player').paused?$('player').play():$('player').pause()};$('seek').oninput=()=>seekTo(Number($('seek').value));$('rewind').onclick=()=>seekTo(currentPosition()-10);$('forward').onclick=()=>seekTo(currentPosition()+10);$('mute').onclick=()=>{$('player').muted=!$('player').muted;$('mute').textContent=$('player').muted?t('sound'):t('mute')};$('speed').onchange=()=>{$('player').playbackRate=Number($('speed').value)};$('fullscreen').onclick=()=>{$('player').requestFullscreen?.()};document.addEventListener('keydown',e=>{if(!$('modal').hidden){if(e.key==='Escape')closeDetails();return}if(!$('player-area').hidden){if(e.key==='Escape'){stopPlayer();return}if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();$('play-pause').click()}if(e.key==='ArrowLeft'){e.preventDefault();seekTo(currentPosition()-10)}if(e.key==='ArrowRight'){e.preventDefault();seekTo(currentPosition()+10)}}});$('close').onclick=closeDetails;$('modal').onclick=e=>{if(e.target===$('modal'))closeDetails()};$('back-library').onclick=async()=>{await saveCurrentProgress(false);stopPlayer()};
async function load(){let p=new URLSearchParams(),q=$('search').value.trim(),tval=$('type').value;if(q)p.set('q',q);if(tval)p.set('type',tval);let r=await api('/api/v1/library'+(p.toString()?'?'+p:''));if(!r.ok){$('status').textContent='Falha ao carregar biblioteca';return}let d=await r.json();$('status').textContent=t('ready');render(d.items)}$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(load,250)};$('type').onchange=load;$('clear').onclick=()=>{$('search').value='';$('type').value='';load()};$('scan').onclick=async()=>{let b=$('scan');b.disabled=true;$('status').textContent='Atualizando...';let r=await api('/api/v1/library/scan',{method:'POST'});if(r.ok)load();else $('status').textContent='Falha ao atualizar';b.disabled=false};window.addEventListener('beforeunload',()=>{if(current){let body=JSON.stringify({position_seconds:currentPosition(),duration_seconds:playback.duration||null,completed:false});fetch(`/api/v1/media/${current}/progress`,{method:'PUT',headers:headers(true),body,keepalive:true}).catch(()=>{})}});if(token)showApp();else showUserSelection();
</script>
