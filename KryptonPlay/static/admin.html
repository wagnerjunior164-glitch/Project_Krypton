<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KryptonPlay — Administração</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0f0f10;color:#eee;font:15px system-ui}main{width:min(1180px,calc(100% - 32px));margin:auto;padding:28px 0 48px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #333;padding-bottom:18px;margin-bottom:24px}h1,h2{margin:0}h1{font-size:28px}h2{font-size:19px;margin-bottom:16px}.muted{color:#999}.error{color:#ff8f8f}.success{color:#9fdda7}.actions{display:flex;gap:10px;flex-wrap:wrap}button{padding:10px 14px;border:1px solid #444;border-radius:8px;background:#181818;color:#eee;font:inherit;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}.panel{background:#181818;border:1px solid #333;border-radius:12px;padding:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#111;border:1px solid #333;border-radius:10px;padding:14px}.stat strong{display:block;font-size:25px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #292929}.row:last-child{border-bottom:0}.badge{display:inline-block;border:1px solid #444;border-radius:999px;padding:3px 8px;font-size:12px;color:#bbb}.library{border:1px solid #333;border-radius:10px;padding:14px;margin-bottom:10px}.locations{margin:8px 0 0 18px;color:#aaa}.empty{color:#888;padding:10px 0}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}header{align-items:flex-start;flex-direction:column}}</style></head><body><main><header><div><h1>KryptonPlay</h1><div class="muted">Ambiente administrativo</div></div><div class="actions"><button id="refresh">Atualizar</button><button id="client">Ir para o cliente</button><button id="logout">Sair</button></div></header><div id="message" class="muted">Carregando...</div><section class="stats" style="margin:18px 0"><div class="stat"><span class="muted">Usuário</span><strong id="user">—</strong><span id="role" class="badge">—</span></div><div class="stat"><span class="muted">Bibliotecas</span><strong id="library-count">—</strong></div><div class="stat"><span class="muted">Servidor</span><strong id="server-name">—</strong></div></section><section class="grid"><div class="panel"><h2>Bibliotecas</h2><div id="libraries"><div class="empty">Carregando...</div></div></div><div class="panel"><h2>Configurações</h2><div id="settings"><div class="empty">Carregando...</div></div></div><div class="panel"><h2>Diagnósticos</h2><div id="diagnostics"><div class="empty">Carregando...</div></div></div></section></main><script>const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,options={}){const r=await fetch(path,{credentials:'same-origin',cache:'no-store',...options});if(!r.ok){let t='Erro '+r.status;try{const d=await r.json();t=d.detail||t}catch{}throw Error(t)}return r.json()}function row(k,v){return `<div class="row"><span class="muted">${esc(k)}</span><span>${esc(v)}</span></div>`}async function load(){ $('message').textContent='Verificando acesso administrativo...';$('message').className='muted';try{const me=await api('/api/auth/me');if(me.role!=='admin')throw Error('Acesso administrativo necessário.');$('user').textContent=me.username;$('role').textContent='Administrador';const [settings,libs]=await Promise.all([api('/api/v1/settings'),api('/api/v1/libraries')]);const s=settings.settings||{},list=libs.libraries||[];$('library-count').textContent=list.length;$('server-name').textContent=s.server_name||'KryptonPlay';$('libraries').innerHTML=list.length?list.map(l=>`<div class="library"><div style="display:flex;justify-content:space-between;gap:8px"><strong>${esc(l.name)}</strong><span class="badge">${esc(l.library_type)}</span></div><div class="muted">Atualizada: ${esc(l.updated_at||'—')}</div>${l.locations?.length?`<ul class="locations">${l.locations.map(x=>`<li>${esc(x.path)}${x.is_primary?' (principal)':''}</li>`).join('')}</ul>`:'<div class="empty">Nenhum caminho configurado.</div>'}</div>`).join(''):'<div class="empty">Nenhuma biblioteca cadastrada.</div>';$('settings').innerHTML=['language','region','timezone','network_access','indexing_mode','playback_mode','setup_completed'].map(k=>row(k,s[k]??'—')).join('');$('diagnostics').innerHTML=row('Dados',s.setup_completed==='true'?'Configuração concluída':'Configuração pendente')+row('FFmpeg','Verificação disponível no setup')+row('FFprobe','Verificação disponível no setup');$('message').textContent='Acesso administrativo confirmado.';$('message').className='success'}catch(e){$('message').textContent=e.message;$('message').className='error'}}$('refresh').onclick=load;$('client').onclick=()=>location.href='/static/player.html';$('logout').onclick=async()=>{try{await api('/api/auth/logout',{method:'POST'})}finally{location.href='/static/index.html'}};load();</script></body></html>
