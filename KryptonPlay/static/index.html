<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KryptonPlay — Identificação do ambiente</title><style>body{margin:0;background:#111;color:#eee;font:16px system-ui;min-height:100vh;display:flex;align-items:center;justify-content:center}main{width:min(720px,calc(100% - 32px));padding:24px}.panel{background:#181818;border:1px solid #333;border-radius:14px;padding:28px}.brand{text-align:center}.brand h1{margin:0;font-size:32px}.brand p{color:#999}.status{margin:24px 0;padding:16px;border:1px solid #333;border-radius:10px;background:#111}.choice{display:grid;gap:12px;margin-top:18px}button,input{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;border:1px solid #444;background:#111;color:#eee;font:inherit}button{cursor:pointer}button.primary{background:#eee;color:#111;border-color:#eee}.secondary{color:#bbb}.hidden{display:none}.error{color:#f88;margin-top:10px}.hint{color:#888;font-size:14px;margin-top:8px}.server-name{font-weight:600}.role{font-size:13px;color:#999;margin-top:4px}.back{margin-top:16px}</style></head>
<body><main><section class="panel"><div class="brand"><h1>KryptonPlay</h1><p>Identificação do ambiente</p></div><div id="status" class="status">Verificando o servidor KryptonPlay...</div><div id="local-choice" class="choice hidden"><button id="use-local" class="primary">Usar este servidor</button><button id="use-other" class="secondary">Conectar a outro servidor</button></div><div id="other" class="hidden"><label for="server-url">Endereço do servidor</label><input id="server-url" type="url" placeholder="http://kryptonplay.local:8000" autocomplete="url"><p class="hint">Use http://kryptonplay.local ou http://127.0.0.1:8000.</p><button id="connect" class="primary">Conectar</button><div id="error" class="error"></div><button id="back" class="back secondary">Voltar</button></div></section></main>
<script>
const $=id=>document.getElementById(id),origin=location.origin;function openLocal(){localStorage.setItem('kryptonplay_server_url',origin);location.href=origin+'/static/player.html'}function normalize(value){let v=value.trim();if(!v)return'';if(!/^https?:\/\//i.test(v))v='http://'+v;return v.replace(/\/+$/,'')}function showOther(){$('local-choice').classList.add('hidden');$('other').classList.remove('hidden');$('server-url').focus()}$('use-local').onclick=openLocal;$('use-other').onclick=showOther;$('back').onclick=()=>{$('other').classList.add('hidden');$('local-choice').classList.remove('hidden');$('error').textContent=''};$('connect').onclick=()=>{let url=normalize($('server-url').value);if(!url){$('error').textContent='Informe o endereço do servidor.';return}try{let parsed=new URL(url);if(!['http:','https:'].includes(parsed.protocol))throw Error();localStorage.setItem('kryptonplay_server_url',parsed.origin);location.href=parsed.origin+'/static/player.html'}catch{$('error').textContent='Endereço de servidor inválido.'}};
(async()=>{let host=location.hostname.toLowerCase();let local=/^(localhost|127\.0\.0\.1|::1|kryptonplay\.local)$/i.test(host);try{let r=await fetch('/api/setup/status',{cache:'no-store'});if(!r.ok)throw Error();let d=await r.json();if(!d.completed){location.href='/';return}if(local&&host==='kryptonplay.local'){localStorage.setItem('kryptonplay_server_url',origin);location.href='/static/player.html';return}let saved=localStorage.getItem('kryptonplay_server_url');if(saved===origin){location.href='/static/player.html';return}$('status').innerHTML=local?'<div class="server-name">Servidor local KryptonPlay disponível</div><div class="role">Acesso por kryptonplay.local ou 127.0.0.1:8000.</div>':'<div class="server-name">Servidor KryptonPlay disponível</div><div class="role">Este navegador está conectado a um servidor existente.</div>';$('local-choice').classList.remove('hidden')}catch(e){if(local){$('status').innerHTML='<div class="server-name">KryptonPlay detectado neste endereço</div><div class="role">O diagnóstico automático não respondeu; você ainda pode usar este servidor local.</div>';$('local-choice').classList.remove('hidden')}else $('status').innerHTML='<div class="error">Não foi possível identificar o ambiente do KryptonPlay. Verifique o endereço do servidor e tente novamente.</div>'}})();
</script></body></html>
